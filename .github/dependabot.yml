version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # Production must run the Node line CI tests on (LTS 24). A Node major bump is a deliberate change of
    # Dockerfile and CI together, not an automatic grouped update.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns:
          - "*"
